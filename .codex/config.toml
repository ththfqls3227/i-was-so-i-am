# Project-scoped browser inspection for I WAS, SO I AM.
# The package is pinned in package-lock.json; --no-install prevents hidden downloads.
[mcp_servers.playwright]
command = "node"
args = ["scripts/playwright-mcp-server.mjs"]
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true
required = false
default_tools_approval_mode = "auto"
